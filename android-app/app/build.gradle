plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "app.anisora"
    compileSdk 34

    defaultConfig {
        applicationId "app.anisora"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "0.8.0-demo"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${rootDir}/../android-native/src"]
            res.srcDirs = ["src/main/res", "${rootDir}/../android-native/res"]
            assets.srcDirs += ["${rootDir}/../android-native/assets"]
            manifest.srcFile "src/main/AndroidManifest.xml"
        }
    }

    lint { abortOnError false }
    packaging { resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] } }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.7.3"
    // OkHttp 5.1.0 - supports compileSdk 34, has CacheControl.maxAge(Duration)
    implementation "com.squareup.okhttp3:okhttp:5.1.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.1.0"
    implementation "com.squareup.okhttp3:okhttp-brotli:5.1.0"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:5.1.0"
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "io.reactivex:rxjava:1.3.8"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
}
